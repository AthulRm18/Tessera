# configs/pyjwt.yaml — stand-in repo 1: PyJWT (Python, MIT)
# Repo: https://github.com/jpadilla/pyjwt
# Pinned commit: 16231abfd1d8eab4953e8779b3017b859c88565e
# Baseline: 472 passed, 4 skipped in 8.04s (run 2026-11-23)
#
# To use: tessera profile --config configs/pyjwt.yaml
# Swap in official repo: update repo.path, base_ref, setup_cmd, test_cmd, then rerun.

repo:
  path: "./_standin_pyjwt"
  base_ref: "16231abfd1d8eab4953e8779b3017b859c88565e"
  setup_cmd: "python -c \"import jwt; print('jwt ready')\""
  test_cmd: "python -m pytest -v --tb=short"
  result_format: "pytest"
  timeout_s: 120
  docker_image: ""  # set after first build

generation:
  n_tasks: 6
  enable_bugfix_axis: false
  behaviour_axes:
    - new_business_rule
    - threshold_or_limit
    - state_transition
    - validation_and_error_policy
    - ordering_or_priority
    - interaction_between_features
    - idempotency
    - rounding_or_units
  max_repairs: 2

gates:
  determinism_runs: 3
  mutation_kill_threshold: 0.70
  solver_attempts: 3
  solver_model_env: "LLM_SOLVER_MODEL"

llm:
  provider_env: "LLM_PROVIDER"
  model_env: "LLM_MODEL"
  key_env: "GEMINI_API_KEY"
  max_tokens: 4096
  temperature: 0.2

budget:
  max_tokens_per_run: 200000
  max_cost_per_run: 2.00
  max_tokens_per_task: 50000
  max_cost_per_task: 0.50

output:
  runs_dir: "./runs/pyjwt"
  packages_dir: "./packages/pyjwt"
  samples_dir: "./samples"
  cache_dir: "./runs/cache"
