# config.yaml — Tessera stand-in repo configuration
#
# ALL repo-specific details live here. Pipeline code never hardcodes repo names,
# paths, languages, or assumptions. Swapping repos = edit this file + rerun.
# When the official repo arrives: update repo.path, base_ref, setup_cmd, test_cmd,
# result_format, docker_image — then run: tessera profile && tessera run

repo:
  path: "./target_repo"
  base_ref: "main"
  setup_cmd: ""          # e.g. "pip install -e ." or "npm install"
  test_cmd: ""           # e.g. "pytest -v" or "npm test"
  result_format: "pytest"  # pytest | jest | junit_xml | text
  timeout_s: 120
  docker_image: ""       # set after first build; reused across all tasks for this repo

generation:
  n_tasks: 6             # target 5–6 strong tasks; quality over count
  enable_bugfix_axis: false  # enable only after feature tasks work (UNVERIFIED organizer req)
  behaviour_axes:
    - new_business_rule
    - threshold_or_limit
    - state_transition
    - validation_and_error_policy
    - ordering_or_priority
    - interaction_between_features
    - idempotency
    - rounding_or_units
  max_repairs: 2

gates:
  determinism_runs: 3
  mutation_kill_threshold: 0.70
  solver_attempts: 3
  solver_model_env: "LLM_SOLVER_MODEL"  # different model/session from generator

llm:
  provider_env: "LLM_PROVIDER"
  model_env: "LLM_MODEL"
  key_env: "LLM_API_KEY"
  max_tokens: 4096
  temperature: 0.2

output:
  runs_dir: "./runs"
  packages_dir: "./packages"
  samples_dir: "./samples"
  cache_dir: "./runs/cache"
