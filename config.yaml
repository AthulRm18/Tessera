# config.yaml — Default active repo configuration (synced to configs/click.yaml)
#
# ALL repo-specific details live here. Pipeline code never hardcodes repo names,
# paths, languages, or assumptions. Swapping repos = edit this file + rerun.
# Official Starter: pallets/click (tag 8.5.1, BSD-3-Clause)

repo:
  path: "./target_repo"
  base_ref: "cf19179e8e2fd54c601378cec9e0d21bb12b6fb1"
  setup_cmd: "pip install -e ."
  test_cmd: "pytest -v --tb=short"
  result_format: "pytest"
  timeout_s: 120
  docker_image: "tessera-click-hardened:cf19179"

generation:
  n_tasks: 5
  enable_bugfix_axis: false
  behaviour_axes:
    - parameter_validation_rules
    - custom_param_type
    - option_interaction_or_precedence
    - help_formatting_behaviour
    - context_or_command_chaining
    - threshold_or_limit
    - state_transition
    - idempotency
  max_repairs: 2

gates:
  determinism_runs: 3
  mutation_kill_threshold: 0.70
  solver_attempts: 2
  solver_provider_env: "LLM_SOLVER_PROVIDER"
  solver_model_env: "LLM_SOLVER_MODEL"

llm:
  provider_env: "LLM_PROVIDER"
  planner_model_env: "LLM_PLANNER_MODEL"
  model_env: "LLM_MODEL"
  key_env: "GEMINI_API_KEY"
  max_tokens: 16384
  temperature: 0.2

budget:
  max_tokens_per_run: 1000000
  max_cost_per_run: 2.00
  max_tokens_per_task: 120000
  max_cost_per_task: 0.40

output:
  runs_dir: "runs/click"
  packages_dir: "packages/click"
  samples_dir: "samples"
  cache_dir: "runs/cache"
